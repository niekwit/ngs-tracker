[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngs-tracker"
version = "0.1.0"
description = "NGS Tracker — self-hosted bioinformatics run tracker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
server = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "werkzeug>=3.0",
]

[tool.setuptools.packages.find]
include = ["ngs_tracker*"]
